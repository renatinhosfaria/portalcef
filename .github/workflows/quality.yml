name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.1
  NODE_VERSION: 22

jobs:
  qualidade:
    name: Lint, tipos, testes, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar lint
        run: pnpm turbo lint --force --concurrency=2

      - name: Verificar tipos
        run: pnpm turbo typecheck --force --concurrency=2

      - name: Executar testes
        run: pnpm turbo test --force --concurrency=1 --continue

      - name: Construir aplicações
        run: pnpm turbo build --force --concurrency=2

      - name: Auditar dependências de produção
        run: pnpm audit --prod --audit-level=high
