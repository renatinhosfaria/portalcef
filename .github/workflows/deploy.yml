name: Publicar e liberar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag imutável; vazio usa o SHA do commit"
        required: false
        type: string
      executar_deploy:
        description: "Executar rolling em runner self-hosted protegido"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PNPM_VERSION: 9.15.1
  NODE_VERSION: 22
  REGISTRY: ghcr.io/${{ github.repository_owner }}/portalcef

jobs:
  qualidade:
    name: Validar antes de publicar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar lint, tipos e testes
        run: |
          pnpm turbo lint --force --concurrency=2
          pnpm turbo typecheck --force --concurrency=2
          pnpm turbo test --force --concurrency=1 --continue

      - name: Construir aplicações
        run: pnpm turbo build --force --concurrency=2

      - name: Auditar dependências de produção
        run: pnpm audit --prod --audit-level=high

  publicar:
    name: Publicar imagens com a mesma tag
    needs: qualidade
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Resolver tag da release
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="$GITHUB_SHA"
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Tag inválida: $tag" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publicar imagens versionadas
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          REGISTRY="$REGISTRY" TAG="$RELEASE_TAG" PUBLISH=true \
            docker buildx bake --push

  deploy:
    name: Rolling protegido
    needs: publicar
    if: ${{ inputs.executar_deploy }}
    runs-on: [self-hosted, producao]
    environment: production
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Executar rolling com a tag publicada
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
        run: ./scripts/deploy-rolling.sh "${{ needs.publicar.outputs.tag }}"
